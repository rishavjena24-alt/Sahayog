version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./sahayog.db
      - JWT_SECRET=sahayog_production_secret_key_2026
      - NODE_ENV=production
    volumes:
      - ./server/prisma:/app/prisma
      - ./data_sheets:/data_sheets

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
